x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
  env_file: .env
  environment:
    PYTHONPATH: /opt/airflow
    HF_HOME: /hf-cache
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
    - hf-cache:/hf-cache
  networks:
    - trackdna-net
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  # ── PostgreSQL (Airflow metadata) ──────────────────────────
  postgres:
    image: postgres:16
    container_name: trackdna-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trackdna-net

  # ── Qdrant (Vector DB) ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: trackdna-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - trackdna-net

  # ── Airflow ────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: trackdna-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username $${AIRFLOW_USERNAME:-admin} \
          --password $${AIRFLOW_PASSWORD:-admin} \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: trackdna-airflow-webserver
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: trackdna-airflow-scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    container_name: trackdna-api
    env_file: .env
    environment:
      HF_HOME: /hf-cache
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./data:/opt/airflow/data
      - hf-cache:/hf-cache
    depends_on:
      qdrant:
        condition: service_started
      airflow-webserver:
        condition: service_started
    networks:
      - trackdna-net
    restart: unless-stopped

  # ── Streamlit UI ───────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: infra/ui/Dockerfile
    container_name: trackdna-ui
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app
    depends_on:
      api:
        condition: service_started
    networks:
      - trackdna-net
    restart: unless-stopped

volumes:
  pg-data:
  qdrant-data:
  hf-cache:
  airflow-logs:

networks:
  trackdna-net:
    driver: bridge

[project]
name = "smip"
version = "0.1.0"
description = "Sports Movement Intelligence Platform: historical soccer and NBA tracking replay through Kafka, Spark Structured Streaming and Iceberg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Core deps must stay importable inside the Spark image (Ubuntu 22.04, Python 3.10).
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0",
  "httpx>=0.27,<1",
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<2.4",
  "pyarrow>=18,<22",
  "clickhouse-connect>=0.8,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
app = [
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "py7zr>=0.22,<2",
  "pyiceberg[pyarrow]>=0.9,<1",
  "scipy>=1.13,<1.16",
]
ml = [
  "scikit-learn>=1.5,<1.8",
  "mlflow-skinny>=2.17,<4",
  "ruptures>=1.1.9,<2",
]
ai = [
  "qdrant-client>=1.12,<2",
]
nba = [
  "nba_api>=1.6,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
  "pyspark==4.1.3",
]

[project.scripts]
smip = "smip.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires running docker stack or downloaded data",
  "spark: requires local pyspark + java",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "I"]
ignore = ["E501", "B008", "B905", "E741"]   # long SQL/strings; typer.Option defaults; zip strict; short names

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "SIM105", "C408"]

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(name)s] %(levelname)s  %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  jobs:
    level: INFO
    handlers: [console]
    propagate: false
  pyspark:
    level: WARN
  py4j:
    level: WARN

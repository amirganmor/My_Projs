/* ─── BallController: persistent ball elements outside innerHTML ─── */
const BallCtrl = {
  state: new Map(),
  timers: new Map(),
  driftFrames: new Map(),
  freshnessInterval: null,
  TRAIL_MAX: 5,
  IDLE_THRESHOLD_MS: 8000,

  getState(gk) {
    if (!this.state.has(gk)) {
      this.state.set(gk, {
        left: 50, top: 50, col: '#8b949e',
        label: '', player: '', minute: '',
        playCount: 0, trail: [], lastEventTime: 0,
        targetLeft: 50, targetTop: 50, targetCol: '#8b949e',
        targetLabel: '', targetPlayer: '', targetMinute: '',
        queue: [], opacity: 1, drifting: false
      });
    }
    return this.state.get(gk);
  },

  setTarget(gk, data) {
    const s = this.getState(gk);
    const hasNew = data.playCount !== s.playCount;
    if (hasNew && s.playCount > 0) {
      s.trail.push({ left: s.left, top: s.top, col: s.col });
      if (s.trail.length > this.TRAIL_MAX) s.trail.shift();
      s.lastEventTime = Date.now();
      this._stopIdleDrift(gk);
    } else if (s.playCount === 0 && data.playCount > 0) {
      s.lastEventTime = Date.now();
    }
    s.targetLeft = data.left;
    s.targetTop = data.top;
    s.targetCol = data.col;
    s.targetLabel = data.label;
    s.targetPlayer = data.player;
    s.targetMinute = data.minute;
    s.playCount = data.playCount;
    s.queue = hasNew ? (data.queue || []) : [];
    s.opacity = data.opacity || 1;
  },

  _bezierPoints(from, to, count) {
    const seed = _hashCode(`${from.left}_${from.top}_${to.left}_${to.top}`);
    const cx = (from.left + to.left) / 2 + _pseudoRand(seed, -6, 6);
    const cy = (from.top + to.top) / 2 + _pseudoRand(seed + 1, -6, 6);
    const pts = [];
    for (let i = 1; i <= count; i++) {
      const t = i / count;
      const x = (1 - t) * (1 - t) * from.left + 2 * (1 - t) * t * cx + t * t * to.left;
      const y = (1 - t) * (1 - t) * from.top + 2 * (1 - t) * t * cy + t * t * to.top;
      pts.push({
        left: x, top: y, col: to.col,
        label: i === count ? to.label : '', player: i === count ? to.player : '',
        minute: i === count ? to.minute : ''
      });
    }
    return pts;
  },

  inject(gk) {
    const container = document.querySelector(`[data-viz="${gk}"]`);
    if (!container) return;
    const s = this.getState(gk);

    if (this.timers.has(gk)) {
      clearTimeout(this.timers.get(gk));
      this.timers.delete(gk);
    }

    container.querySelectorAll('.ball-trail-dot').forEach(d => d.remove());
    const trailSlice = s.trail.slice(-this.TRAIL_MAX);
    const tLen = trailSlice.length;
    trailSlice.forEach((t, i) => {
      const dot = document.createElement('div');
      dot.className = 'ball-trail-dot';
      const frac = (i + 1) / (tLen + 1);
      const op = 0.08 + frac * 0.3;
      const sz = 4 + frac * 8;
      dot.style.cssText = `left:${t.left}%;top:${t.top}%;width:${sz}px;height:${sz}px;background:${t.col};opacity:${op};z-index:3;`;
      container.appendChild(dot);
    });

    let ball = container.querySelector('.ball-overlay');
    const isNew = !ball;
    if (!ball) {
      ball = document.createElement('div');
      ball.className = 'ball-overlay';
      ball.dataset.ball = gk;
      ball.innerHTML = `<div class="ball-pulse-ring"></div><div class="ball-dot"><div class="ball-dot-inner"></div></div><div class="ball-popup persistent"><div class="ball-popup-type"></div><div class="ball-popup-player"></div><div class="ball-popup-min" style="font-size:0.62rem;color:#8b949e;margin-top:1px"></div></div>`;
      container.appendChild(ball);
    }

    ball.style.opacity = s.opacity;
    this._updatePulseClass(ball, s);

    if (isNew) {
      ball.classList.add('no-transition');
      ball.style.left = s.left + '%';
      ball.style.top = s.top + '%';
      this._setColors(ball, s.col);
      this._setPopup(ball, s);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ball.classList.remove('no-transition');
          if (s.queue.length > 1) {
            this._animateQueue(gk, ball, s);
          } else {
            ball.style.left = s.targetLeft + '%';
            ball.style.top = s.targetTop + '%';
            this._setColors(ball, s.targetCol);
            this._setPopup(ball, { label: s.targetLabel, player: s.targetPlayer, minute: s.targetMinute });
            s.left = s.targetLeft;
            s.top = s.targetTop;
            s.col = s.targetCol;
          }
        });
      });
    } else {
      if (s.queue.length > 1) {
        this._stopIdleDrift(gk);
        this._animateQueue(gk, ball, s);
      } else if (s.left !== s.targetLeft || s.top !== s.targetTop) {
        this._stopIdleDrift(gk);
        ball.style.left = s.targetLeft + '%';
        ball.style.top = s.targetTop + '%';
        this._setColors(ball, s.targetCol);
        this._setPopup(ball, { label: s.targetLabel, player: s.targetPlayer, minute: s.targetMinute });
        s.left = s.targetLeft;
        s.top = s.targetTop;
        s.col = s.targetCol;
      } else {
        const elapsed = Date.now() - (s.lastEventTime || 0);
        if (elapsed > this.IDLE_THRESHOLD_MS && !s.drifting && s.playCount > 0) {
          this._startIdleDrift(gk, ball, s);
        }
      }
    }
    s.queue = [];
  },

  _animateQueue(gk, ball, s) {
    let expandedQueue = [];
    let prev = { left: s.left, top: s.top, col: s.col, label: '', player: '', minute: '' };
    const rawQueue = [...s.queue];
    rawQueue.forEach(pos => {
      const dist = Math.hypot(pos.left - prev.left, pos.top - prev.top);
      if (dist > 5) {
        const bezierCount = Math.min(4, Math.max(2, Math.round(dist / 10)));
        const intermediate = this._bezierPoints(prev, pos, bezierCount);
        expandedQueue.push(...intermediate);
      } else {
        expandedQueue.push(pos);
      }
      prev = pos;
    });

    const totalMs = Math.min(4000, 600 * rawQueue.length);
    const stepMs = Math.max(80, Math.floor(totalMs / expandedQueue.length));

    expandedQueue.forEach((pos, i) => {
      const tid = setTimeout(() => {
        requestAnimationFrame(() => {
          ball.style.left = pos.left + '%';
          ball.style.top = pos.top + '%';
          if (pos.col) this._setColors(ball, pos.col);
          if (pos.label || pos.player) this._setPopup(ball, pos);
          s.left = pos.left;
          s.top = pos.top;
          if (pos.col) s.col = pos.col;
        });
      }, i * stepMs);
      if (i === expandedQueue.length - 1) this.timers.set(gk, tid);
    });
    s.queue = [];
  },

  _startIdleDrift(gk, ball, s) {
    if (s.drifting) return;
    s.drifting = true;
    const anchorLeft = s.left;
    const anchorTop = s.top;
    const tick = () => {
      if (!s.drifting) return;
      const t = Date.now();
      const dx = Math.sin(t / 1200) * 1.5;
      const dy = Math.cos(t / 1500) * 1.0;
      ball.classList.add('no-transition');
      ball.style.left = (anchorLeft + dx) + '%';
      ball.style.top = (anchorTop + dy) + '%';
      this.driftFrames.set(gk, requestAnimationFrame(tick));
    };
    this.driftFrames.set(gk, requestAnimationFrame(tick));
  },

  _stopIdleDrift(gk) {
    const s = this.state.get(gk);
    if (s) s.drifting = false;
    const frame = this.driftFrames.get(gk);
    if (frame) { cancelAnimationFrame(frame); this.driftFrames.delete(gk); }
    const container = document.querySelector(`[data-viz="${gk}"]`);
    if (container) {
      const ball = container.querySelector('.ball-overlay');
      if (ball) ball.classList.remove('no-transition');
    }
  },

  _updatePulseClass(ball, s) {
    const pulse = ball.querySelector('.ball-pulse-ring');
    if (!pulse) return;
    const elapsed = s.lastEventTime ? Date.now() - s.lastEventTime : 99999;
    pulse.classList.remove('fresh', 'stale', 'idle');
    if (elapsed < 5000) { pulse.classList.add('fresh'); pulse.style.background = s.col || '#3fb950'; }
    else if (elapsed < 15000) { pulse.classList.add('stale'); pulse.style.background = '#d9b100'; }
    else { pulse.classList.add('idle'); pulse.style.background = '#484f58'; }
  },

  _setColors(ball, col) {
    const dot = ball.querySelector('.ball-dot');
    const pulse = ball.querySelector('.ball-pulse-ring');
    if (dot) dot.style.background = col;
    if (pulse) pulse.style.background = col;
  },

  _setPopup(ball, data) {
    const popup = ball.querySelector('.ball-popup');
    if (!popup) return;
    const typEl = popup.querySelector('.ball-popup-type');
    const plEl = popup.querySelector('.ball-popup-player');
    const minEl = popup.querySelector('.ball-popup-min');
    if (typEl) typEl.textContent = data.label || '';
    if (plEl) plEl.textContent = data.player || '';
    if (minEl) {
      const m = data.minute || '';
      minEl.textContent = m ? (m.includes(':') || m.startsWith('Q') ? m : m + "'") : '';
    }
    if (data.label || data.player) {
      popup.style.animation = 'none';
      void popup.offsetWidth;
      popup.style.animation = '';
    }
  },

  injectAll() {
    openGames.forEach(gk => this.inject(gk));
  },

  activate(gk) {
    requestAnimationFrame(() => this.inject(gk));
  },

  startFreshnessTimer() {
    if (this.freshnessInterval) return;
    this.freshnessInterval = setInterval(() => {
      document.querySelectorAll('.freshness-counter').forEach(el => {
        const gk = el.dataset.freshness;
        const s = this.state.get(gk);
        if (!s || !s.lastEventTime) return;
        const ago = Math.floor((Date.now() - s.lastEventTime) / 1000);
        let text, color;
        if (ago < 5) { text = 'Just now'; color = '#3fb950'; }
        else if (ago < 30) { text = ago + 's ago'; color = '#3fb950'; }
        else if (ago < 60) { text = ago + 's ago'; color = '#d9b100'; }
        else { text = Math.floor(ago / 60) + 'm ago'; color = '#484f58'; }
        el.textContent = 'Last event: ' + text;
        el.style.color = color;
      });

      this.state.forEach((s, gk) => {
        const container = document.querySelector(`[data-viz="${gk}"]`);
        if (!container) return;
        const ball = container.querySelector('.ball-overlay');
        if (ball) this._updatePulseClass(ball, s);
      });
    }, 1000);
  }
};

BallCtrl.startFreshnessTimer();

/* ─── CDC: Two-Tier Change Data Capture ─── */
const leagueFingerprints = new Map();
const gameRowFPs = new Map();
const gameDetailFPs = new Map();

function rowFingerprint(g) {
  return `${g.homeTeam.score}_${g.awayTeam.score}_${g.statusText}`;
}

function detailFingerprint(g) {
  const plays = g.plays || [];
  const lineups = g.lineups || [];
  const lastPlay = plays.length > 0 ? plays[plays.length - 1] : {};
  return `${plays.length}_${lastPlay.clock || ''}_${lastPlay.description || ''}_${lineups.length}`;
}

function combinedFingerprint(g) {
  return rowFingerprint(g) + '|' + detailFingerprint(g);
}

function leagueFingerprint(games) {
  if (!games || games.length === 0) return 'empty';
  return games.map(g => combinedFingerprint(g)).join('||');
}

function renderGameRow(g, league) {
  const key = `${league}_${g.gameId}`;
  const isOpen = openGames.has(key);
  const live = isLive(g.statusText);
  const liveIcon = live ? '<span class="live-dot" style="display:inline-block;width:6px;height:6px;background:#3fb950;border-radius:50%;margin-right:4px;animation:blink 1.4s infinite"></span>' : '';
  return `<div class="game-row ${isOpen ? 'open' : ''}" data-game="${key}" onclick="toggleDetail('${key}')">
      <div class="team away"><span class="team-name">${escapeHtml(g.awayTeam.teamName)}</span></div>
      <div class="score-block">
        <div class="scores">${g.awayTeam.score} &ndash; ${g.homeTeam.score}</div>
        <div class="status">${liveIcon}${escapeHtml(g.statusText)}</div>
      </div>
      <div class="team home"><span class="team-name">${escapeHtml(g.homeTeam.teamName)}</span></div>
      <span class="expand-icon">&#9654;</span>
    </div>
    <div class="game-detail ${isOpen ? 'open' : ''}" data-detail="${key}">
      <div class="game-detail-inner">${safeTracker(g, league, key)}</div>
    </div>`;
}

/* ─── Game List Render (CDC-aware) ─── */
function renderGames(containerId, games, league) {
  const el = document.getElementById(containerId);
  if (!games || games.length === 0) {
    el.innerHTML = '<div class="no-games">No games at the moment</div>';
    leagueFingerprints.set(league, 'empty');
    return;
  }

  const newLeagueFP = leagueFingerprint(games);
  const oldLeagueFP = leagueFingerprints.get(league);

  if (oldLeagueFP === newLeagueFP && el.children.length > 0) {
    return;
  }
  leagueFingerprints.set(league, newLeagueFP);

  const rowChanged = new Set();
  const detailChanged = new Set();
  games.forEach(g => {
    const key = `${league}_${g.gameId}`;
    const newRow = rowFingerprint(g);
    const newDetail = detailFingerprint(g);
    if (gameRowFPs.get(key) !== newRow) { rowChanged.add(key); gameRowFPs.set(key, newRow); }
    if (gameDetailFPs.get(key) !== newDetail) { detailChanged.add(key); gameDetailFPs.set(key, newDetail); }
  });

  if (rowChanged.size === 0 && detailChanged.size === 0 && el.children.length > 0) return;

  if (el.children.length > 0 && (rowChanged.size + detailChanged.size) < games.length * 2) {
    games.forEach(g => {
      const key = `${league}_${g.gameId}`;
      const needsRow = rowChanged.has(key);
      const needsDetail = detailChanged.has(key);
      if (!needsRow && !needsDetail) return;

      if (needsRow) {
        const scoreEl = el.querySelector(`[data-game="${key}"] .scores`);
        if (scoreEl) scoreEl.innerHTML = `${g.awayTeam.score} &ndash; ${g.homeTeam.score}`;
        const statusEl = el.querySelector(`[data-game="${key}"] .status`);
        if (statusEl) {
          const live = isLive(g.statusText);
          const liveIcon = live ? '<span class="live-dot" style="display:inline-block;width:6px;height:6px;background:#3fb950;border-radius:50%;margin-right:4px;animation:blink 1.4s infinite"></span>' : '';
          statusEl.innerHTML = `${liveIcon}${escapeHtml(g.statusText)}`;
        }
      }

      if (needsDetail) {
        const detailInner = el.querySelector(`[data-detail="${key}"] .game-detail-inner`);
        if (detailInner && openGames.has(key)) {
          detailInner.innerHTML = safeTracker(g, league, key);
        }
      }
    });
    return;
  }

  el.innerHTML = games.map(g => renderGameRow(g, league)).join('');
}

/* ─── Refresh ─── */
async function refresh() {
  try {
    const resp = await fetch('/api/scores');
    if (!resp.ok) return;
    const data = await resp.json();
    for (const league of ['nba', 'nfl', 'premier_league', 'la_liga', 'champions_league']) {
      const games = data[league] || [];
      try { renderGames('games-' + league, games, league); }
      catch (e) { console.error('Render error for ' + league + ':', e); }
    }
    BallCtrl.injectAll();
  } catch (err) { console.error('Refresh failed:', err); }
}

refresh();
setInterval(refresh, 3000);

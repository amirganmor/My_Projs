services:
  # ─── KAFKA BROKER ───
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=DOCKER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - ALLOW_ANONYMOUS_LOGIN=yes
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ─── POSTGRESQL ───
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=scoreboard
      - POSTGRES_USER=scoreboard
      - POSTGRES_PASSWORD=scoreboard
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── SPARK MASTER ───
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8081"
      - "7077:7077"
    environment:
      - SPARK_MASTER_PORT=7077

  # ─── SPARK WORKER ───
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=10g
    deploy:
      resources:
        limits:
          memory: 12G

  # ─── PRODUCERS ───
  nba-producer:
    build: ./nba
    container_name: nba-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  nfl-producer:
    build: ./nfl
    container_name: nfl-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  pl-producer:
    build:
      context: .
      dockerfile: premier_league/Dockerfile
    container_name: pl-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  laliga-producer:
    build:
      context: .
      dockerfile: la_liga/Dockerfile
    container_name: laliga-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  cl-producer:
    build:
      context: .
      dockerfile: champions_league/Dockerfile
    container_name: cl-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── SCOREBOARD WEB UI ───
  scoreboard-ui:
    build: ./scoreboard_ui
    container_name: scoreboard-ui
    ports:
      - "5050:5050"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── SPARK ANALYTICS (Kafka → PostgreSQL) ───
  spark-analytics:
    build: ./spark_analytics
    container_name: spark-analytics
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/scoreboard
      - POSTGRES_USER=scoreboard
      - POSTGRES_PASSWORD=scoreboard
    volumes:
      - spark_checkpoint:/tmp/spark_checkpoint
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    restart: unless-stopped

  # ─── PLAYER STATS FETCHER (batch, every 6 hours) ───
  player-stats-fetcher:
    build: ./player_stats
    container_name: player-stats-fetcher
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scoreboard
      - POSTGRES_USER=scoreboard
      - POSTGRES_PASSWORD=scoreboard
      - FETCH_INTERVAL_HOURS=6
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  spark_checkpoint:
